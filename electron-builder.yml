appId: dev.skillcentral.app
productName: Skill Central
copyright: Copyright © 2026 BobcGn

directories:
  output: release-artifacts
  buildResources: build

artifactName: Skill-Central-${version}-${os}-${arch}.${ext}
generateUpdatesFilesForAllChannels: true

files:
  - dist/**/*
  - package.json
  - README.md
  - README.zh-CN.md
  - LICENSE

extraMetadata:
  main: dist/desktop/main.js

publish:
  provider: github
  owner: BobcGn
  repo: skill-central

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  # Ad-hoc signing (`-`) re-seals the bundle so electron-updater's
  # SecStaticCodeCheckValidity passes. `identity: null` leaves Electron's
  # stale ad-hoc signature behind, which fails update installation with
  # "code has no resources but signature indicates they must be present".
  identity: "-"
  # Hardened runtime is only meaningful for Developer ID + notarization; with
  # ad-hoc signing it would enforce library validation on every dylib with no
  # benefit, so keep it off for unsigned release candidates.
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
