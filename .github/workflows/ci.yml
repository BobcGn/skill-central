name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Build web assets
        run: npm run build:web

      - name: Run release risk gate
        run: npm run test:risk

      - name: Verify build artifacts
        run: |
          test -f dist/index.js || { echo "::error::dist/index.js missing"; exit 1; }
          test -f dist/web/index.html || { echo "::error::dist/web/index.html missing"; exit 1; }

  integration:
    name: Full Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Run explicit MCP protocol gate
        run: npm run test:mcp

      - name: Run release risk gate
        run: npm run test:risk
