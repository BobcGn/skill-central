name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Build web assets
        run: npm run build:web

      - name: Run release risk gate
        run: npm run test:risk

      - name: Verify build artifacts
        run: |
          test -f dist/index.js || { echo "::error::dist/index.js missing"; exit 1; }
          test -f dist/web/index.html || { echo "::error::dist/web/index.html missing"; exit 1; }

  integration:
    name: Full Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Run explicit MCP protocol gate
        run: npm run test:mcp

      - name: Run release risk gate
        run: npm run test:risk

  desktop-package:
    name: Desktop Package (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: integration

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package_script: package:mac
            artifact_name: skill-central-ci-macos
            artifact_paths: |
              release-artifacts/Skill-Central-1.0.0-mac-arm64.dmg
              release-artifacts/Skill-Central-1.0.0-mac-x64.dmg
              release-artifacts/Skill-Central-1.0.0-mac-arm64.zip
              release-artifacts/Skill-Central-1.0.0-mac-x64.zip
              release-artifacts/latest-mac.yml
          - name: Windows
            os: windows-latest
            package_script: package:win
            artifact_name: skill-central-ci-windows
            artifact_paths: |
              release-artifacts/Skill-Central-1.0.0-win-x64.exe
              release-artifacts/Skill-Central-1.0.0-win-x64.exe.blockmap
              release-artifacts/Skill-Central-1.0.0-win-x64.msi
              release-artifacts/Skill-Central-1.0.0-win-x64.zip
              release-artifacts/latest.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate GitHub OAuth configuration
        shell: bash
        env:
          SKILL_CENTRAL_GITHUB_CLIENT_ID: ${{ vars.SKILL_CENTRAL_GITHUB_CLIENT_ID }}
        run: |
          if [[ ! "$SKILL_CENTRAL_GITHUB_CLIENT_ID" =~ ^[A-Za-z0-9._-]{8,128}$ ]]; then
            echo "::error::Set repository variable SKILL_CENTRAL_GITHUB_CLIENT_ID before native desktop packaging."
            exit 1
          fi

      - name: Build native desktop package
        env:
          SKILL_CENTRAL_GITHUB_CLIENT_ID: ${{ vars.SKILL_CENTRAL_GITHUB_CLIENT_ID }}
        run: npm run ${{ matrix.package_script }}

      - name: Upload native package evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7
