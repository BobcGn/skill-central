name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_TAG="v$VERSION"
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a v* tag."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($PACKAGE_VERSION) does not match tag ($VERSION)."
            exit 1
          fi

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a ## [$VERSION] entry."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "release_tag=$RELEASE_TAG"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          START="$(grep -n "^## \[$VERSION\]" CHANGELOG.md | head -1 | cut -d: -f1)"
          END="$(awk -v s="$START" 'NR>s && /^## \[/ {print NR; exit}' CHANGELOG.md)"
          END="${END:-$(($(wc -l < CHANGELOG.md) + 1))}"
          sed -n "${START},$((END-1))p" CHANGELOG.md > release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          RELEASE_FLAGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            RELEASE_FLAGS+=( "--prerelease" "--latest=false" )
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              "${RELEASE_FLAGS[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              "${RELEASE_FLAGS[@]}"
          fi

  source-archive:
    name: Source Archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source archive
        shell: bash
        run: |
          mkdir -p release-artifacts
          git archive \
            --format=zip \
            --prefix="skill-central-${{ needs.prepare.outputs.version }}/" \
            --output="release-artifacts/Skill-Central-${{ needs.prepare.outputs.version }}-source.zip" \
            HEAD

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-central-source
          path: release-artifacts/*.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-artifacts/*.zip --repo "$GITHUB_REPOSITORY" --clobber

  desktop:
    name: Desktop Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package_script: package:mac
            artifact_name: skill-central-macos
            artifact_paths: |
              release-artifacts/*.dmg
              release-artifacts/*.zip
            artifact_extensions: dmg zip
          - name: Windows
            os: windows-latest
            package_script: package:win
            artifact_name: skill-central-windows
            artifact_paths: |
              release-artifacts/*.msi
              release-artifacts/*.zip
            artifact_extensions: msi zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        run: npm run ${{ matrix.package_script }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ARTIFACT_EXTENSIONS: ${{ matrix.artifact_extensions }}
        run: |
          ARTIFACTS=()
          for ext in $ARTIFACT_EXTENSIONS; do
            for file in release-artifacts/*."$ext"; do
              if [ -e "$file" ]; then
                ARTIFACTS+=( "$file" )
              fi
            done
          done
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "::error::No release artifacts matched extensions: $ARTIFACT_EXTENSIONS"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${ARTIFACTS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
