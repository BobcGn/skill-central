name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      # The Client ID is public package metadata; a client secret must never be
      # configured for a desktop Device Flow build.
      - name: Validate GitHub OAuth configuration
        shell: bash
        env:
          SKILL_CENTRAL_GITHUB_CLIENT_ID: ${{ vars.SKILL_CENTRAL_GITHUB_CLIENT_ID }}
        run: |
          if [[ ! "$SKILL_CENTRAL_GITHUB_CLIENT_ID" =~ ^[A-Za-z0-9._-]{8,128}$ ]]; then
            echo "::error::Set repository variable SKILL_CENTRAL_GITHUB_CLIENT_ID to the public client ID of the project OAuth App with Device Flow enabled."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test MCP protocol explicitly
        run: npm run test:mcp

      - name: Validate release risk gates
        run: npm run test:risk

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_TAG="v$VERSION"
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release workflow must run from a v* tag."
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag must point to a commit contained in origin/main."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($PACKAGE_VERSION) does not match tag ($VERSION)."
            exit 1
          fi

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a ## [$VERSION] entry."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "release_tag=$RELEASE_TAG"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          START="$(grep -n "^## \[$VERSION\]" CHANGELOG.md | head -1 | cut -d: -f1)"
          END="$(awk -v s="$START" 'NR>s && /^## \[/ {print NR; exit}' CHANGELOG.md)"
          END="${END:-$(($(wc -l < CHANGELOG.md) + 1))}"
          sed -n "${START},$((END-1))p" CHANGELOG.md > release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  source-archive:
    name: Source Archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source archive
        shell: bash
        run: |
          mkdir -p release-artifacts
          git archive \
            --format=zip \
            --prefix="skill-central-${{ needs.prepare.outputs.version }}/" \
            --output="release-artifacts/Skill-Central-${{ needs.prepare.outputs.version }}-source.zip" \
            HEAD

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-central-source
          path: release-artifacts/*.zip
          if-no-files-found: error

  desktop:
    name: Desktop Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package_script: package:mac
            artifact_name: skill-central-macos
            artifact_paths: |
              release-artifacts/*.dmg
              release-artifacts/*.zip
              release-artifacts/latest-mac.yml
          - name: Windows
            os: windows-latest
            package_script: package:win
            artifact_name: skill-central-windows
            artifact_paths: |
              release-artifacts/*.exe
              release-artifacts/*.blockmap
              release-artifacts/*.msi
              release-artifacts/latest.yml
              release-artifacts/*.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        env:
          SKILL_CENTRAL_GITHUB_CLIENT_ID: ${{ vars.SKILL_CENTRAL_GITHUB_CLIENT_ID }}
        run: npm run ${{ matrix.package_script }}

      - name: Validate generated Homebrew Cask
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAP_DIR="$RUNNER_TEMP/skill-central-homebrew-validation"
          TAP_NAME="skillcentral/candidate"
          node scripts/prepare-homebrew-candidate.mjs \
            --version "$VERSION" \
            --arm64 "release-artifacts/Skill-Central-$VERSION-mac-arm64.dmg" \
            --x64 "release-artifacts/Skill-Central-$VERSION-mac-x64.dmg" \
            --url "https://github.com/BobcGn/skill-central/releases/download/v#{version}/Skill-Central-#{version}-mac-#{arch}.dmg" \
            --tap-dir "$TAP_DIR"
          trap 'brew untap "$TAP_NAME" >/dev/null 2>&1 || true' EXIT
          brew tap --custom-remote "$TAP_NAME" "file://$TAP_DIR"
          brew trust "$TAP_NAME"
          brew style --cask "$TAP_NAME/skill-central"
          brew audit --cask --strict "$TAP_NAME/skill-central"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  # Stage the checksum-pinned Cask as a PR, but leave it unmerged until the
  # corresponding draft Release has been manually validated and published.
  homebrew-cask:
    name: Prepare Homebrew Cask Update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare, desktop]

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          path: release-source
          fetch-depth: 0

      - name: Checkout main for Cask pull request
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: skill-central-macos
          path: release-source/release-artifacts

      - name: Generate pinned Cask
        shell: bash
        run: |
          node release-source/scripts/generate-homebrew-cask.mjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --arm64 "release-source/release-artifacts/Skill-Central-${{ needs.prepare.outputs.version }}-mac-arm64.dmg" \
            --x64 "release-source/release-artifacts/Skill-Central-${{ needs.prepare.outputs.version }}-mac-x64.dmg" \
            --output "main/Casks/skill-central.rb"
          ruby -c main/Casks/skill-central.rb

      - name: Upload generated Cask
        uses: actions/upload-artifact@v4
        with:
          name: skill-central-homebrew
          path: main/Casks/skill-central.rb
          if-no-files-found: error

      - name: Push Cask update branch
        id: cask-branch
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: main
        run: |
          BRANCH="automation/homebrew-$VERSION"
          if git diff --quiet -- Casks/skill-central.rb; then
            echo "Cask is already current for $VERSION."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add Casks/skill-central.rb
          git commit -m "chore(homebrew): update cask to $VERSION"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Some repositories disable GitHub Actions from creating pull requests.
      # The generated Cask artifact and pushed branch remain hard gates; only
      # PR creation degrades to a maintainer action so Draft staging cannot be
      # deadlocked by that repository setting.
      - name: Create Cask update pull request
        id: cask-pr
        if: steps.cask-branch.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: main
        run: |
          BRANCH="automation/homebrew-$VERSION"

          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore(homebrew): update cask to $VERSION" \
              --body "Pins the Homebrew Cask to the staged $VERSION macOS DMGs and their SHA-256 digests. Do not merge until the validated draft Release is public."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore(homebrew): update cask to $VERSION" \
              --body "Pins the Homebrew Cask to the staged $VERSION macOS DMGs and their SHA-256 digests. Do not merge until the validated draft Release is public."
          fi

      - name: Record manual Cask PR fallback
        if: steps.cask-pr.outcome == 'failure'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BRANCH="automation/homebrew-$VERSION"
          COMPARE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
          echo "::warning::GitHub Actions could not create the Cask PR. The checksum-pinned branch was pushed successfully; a maintainer must open it before publishing."
          {
            echo "## Manual Homebrew Cask PR required"
            echo
            echo "Open: $COMPARE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tag builds only stage a Draft. Publishing remains an explicit maintainer
  # decision after artifact, install, authentication, and update verification.
  draft-release:
    name: Stage Draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare, source-archive, desktop, homebrew-cask]

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: skill-central-*
          path: staged-artifacts
          merge-multiple: true

      - name: Validate staged artifacts
        shell: bash
        run: |
          test -f release-notes.md
          test -f staged-artifacts/skill-central.rb
          test -n "$(find staged-artifacts -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find staged-artifacts -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find staged-artifacts -maxdepth 1 -type f -name '*-source.zip' -print -quit)"

      - name: Create or update draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          RELEASE_FLAGS=( "--draft" )
          if [ "$IS_PRERELEASE" = "true" ]; then
            RELEASE_FLAGS+=( "--prerelease" "--latest=false" )
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::$RELEASE_TAG is already public; refusing to overwrite it."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              "${RELEASE_FLAGS[@]:1}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              "${RELEASE_FLAGS[@]}"
          fi

          mapfile -d '' ARTIFACTS < <(find staged-artifacts -maxdepth 1 -type f -print0)
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "::error::No staged artifacts found."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${ARTIFACTS[@]}" --repo "$GITHUB_REPOSITORY" --clobber

          echo "Draft staged. Complete the release checklist before publishing; merge the Cask PR immediately after the Release is public."
