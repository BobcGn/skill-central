# ============================================================================
# Example Rule — skillcentral.dev/rule/v1
# ----------------------------------------------------------------------------
# This file is a documentation sample. The leading "_" in the filename means
# the rule reader SKIPS it during discovery (same convention as skill
# templates), so it never appears in `skill-central rules`. Copy it to a file
# without the "_" prefix (e.g. `no-hardcoded-secrets.yaml`) to make it a real,
# loaded rule.
# ============================================================================

schemaVersion: skillcentral.dev/rule/v1
id: no-hardcoded-secrets
name: No hardcoded secrets
description: Flag credentials, API keys, or tokens committed directly into source.
severity: error
tags:
  - security
  - review
appliesTo: global
body: |
  Do not commit secrets (API keys, passwords, tokens, private keys) directly
  into source files. Load them from environment variables or a secret manager
  instead. If a secret is found in a diff, block the change and rotate the
  exposed credential.
